<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <rect width="900" height="460" fill="#181b22"/>
  <text x="40" y="64" fill="#fb7185" font-family="Arial, sans-serif" font-size="24" font-weight="bold">БЫЛО — ВАКУУМНЫЕ ПАКЕТЫ С НАСОСОМ</text>
  <rect x="40" y="90" width="820" height="330" rx="16" fill="#232833" stroke="#3b4254"/>
  <text x="72" y="148" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="20">• Серое фото пакета без показа экономии места и объёма</text>
  <text x="72" y="200" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="20">• Неясно, сколько места освободится в шкафу или чемодане</text>
  <text x="72" y="252" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="20">• Не выделено сразу, что ручной насос и размеры в комплекте</text>
  <text x="72" y="370" fill="#fda4af" font-family="Arial, sans-serif" font-size="18">Видео «Было» (0–3с): объёмные вещи не помещаются в шкаф</text>
</svg>